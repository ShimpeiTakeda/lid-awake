name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, device names, user names, or ChatGPT conversation content. Report vulnerabilities through the private channel in SECURITY.md.
  - type: input
    id: commit
    attributes:
      label: Commit or version
      description: Provide the output of `git rev-parse HEAD` or the app version.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Provide the macOS version, Mac chip, and external-power state.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I verified `SleepDisabled` while Lid Awake was in Normal Mode
          required: true
