name: Bug report
description: 再現可能な不具合を報告します
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: credential、端末名、ユーザー名、ChatGPTの会話内容を記載しないでください。脆弱性はSECURITY.mdの非公開経路へ報告してください。
  - type: input
    id: commit
    attributes:
      label: Commitまたはversion
      description: `git rev-parse HEAD`の値、またはversionを記載してください。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 環境
      description: macOS version、Macのchip、AC接続状態を記載してください。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待結果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の結果
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 安全確認
      options:
        - label: 通常モード時の`SleepDisabled`を確認しました
          required: true
